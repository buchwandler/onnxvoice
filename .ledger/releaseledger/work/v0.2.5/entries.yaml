  - kind: added
    summary: "Added native ONNXVoice runtime support for Inflect v2 Nano and Micro models"
    body: >-
      The adapter parses the pinned Inflect bundle catalog, installs and opens the split duration/decode graphs, and accepts model-ready token IDs with speed, variation, and deterministic seed controls. Fixed default-voice discovery and 24 kHz mono output validation use ONNXVoice's common provider and session lifecycle.
