[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["onnxvoice*"]

[tool.setuptools.package-data]
onnxvoice = ["py.typed", "data/*.json"]

[project]
name = "onnxvoice"
description = "Manage, validate and run ONNX voice models from one shared local store"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "onnxvoice contributors"}]
keywords = ["onnx", "tts", "speech", "voice", "piper", "kokoro"]
dependencies = [
  "numpy>=1.23",
  "platformdirs>=4,<5",
]
dynamic = ["version"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/buchwandler/onnxvoice"
Repository = "https://github.com/buchwandler/onnxvoice"
Issues = "https://github.com/buchwandler/onnxvoice/issues"

[project.scripts]
onnxvoice = "onnxvoice.cli:main"

[project.optional-dependencies]
cpu = ["onnxruntime>=1.17"]
gpu = ["onnxruntime-gpu>=1.17"]
directml = ["onnxruntime-directml>=1.17"]
openvino = ["onnxruntime-openvino>=1.17"]
coreml = []  # Supplied by the supported macOS ONNX Runtime build.
nnapi = []  # Supplied by a compatible mobile ONNX Runtime build.
xnnpack = []  # Supplied by a compatible ONNX Runtime build.
mobile = []  # Convenience marker for platform-managed mobile providers.
pocket = ["huggingface_hub>=0.24,<2", "safetensors>=0.4,<1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.0",
]

[tool.setuptools_scm]
write_to = "onnxvoice/_version.py"
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
exclude = ["01_todo.md", "plan.md"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
