name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Check tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import onnxvoice

          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag != onnxvoice.__version__:
              raise SystemExit(
                  f"Release tag {tag!r} does not match package version {onnxvoice.__version__!r}"
              )
          PY
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy onnxvoice
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Smoke test wheel in clean virtualenv
        run: |
          python -m venv /tmp/onnxvoice-release-venv
          /tmp/onnxvoice-release-venv/bin/python -m pip install --upgrade pip
          /tmp/onnxvoice-release-venv/bin/python -m pip install dist/*.whl
          /tmp/onnxvoice-release-venv/bin/python -c "import onnxvoice; print(onnxvoice.__version__)"
          /tmp/onnxvoice-release-venv/bin/onnxvoice --help
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
